name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install React 18 compatibility peers
        if: matrix.react == 18
        run: npm install --no-save --package-lock=false --ignore-scripts react@18 react-dom@18 @types/react@18 @types/react-dom@18

      - name: Show installed React versions
        run: node -e "console.log('react', require('react/package.json').version, 'react-dom', require('react-dom/package.json').version)"

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run size:report
        if: matrix.react == 19

      - run: npm run lint:package
        if: matrix.react == 19

      - run: npm run check:package
        if: matrix.react == 19

      - run: npm pack --dry-run
        if: matrix.react == 19
